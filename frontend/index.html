<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduTrack</title>

    <!-- Bootstrap, Bootstrap Icons, Poppins font and our own styles -->
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid">
        <div class="row min-vh-100">

            <!-- Welcome panel (hidden on small screens) -->
            <!-- TODO: replace the big icon with an unDraw illustration saved in images/ -->
            <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center text-center text-white bg-brand p-5">
                <i class="bi bi-mortarboard-fill login-icon"></i>
                <h1 class="fw-bold mt-3">EduTrack</h1>
                <p class="lead mb-4">Training Institute Management System</p>
                <ul class="list-unstyled text-start">
                    <li class="mb-2"><i class="bi bi-journal-bookmark me-2"></i>Courses and batches</li>
                    <li class="mb-2"><i class="bi bi-people me-2"></i>Students and enrollments</li>
                    <li class="mb-2"><i class="bi bi-receipt me-2"></i>Fee invoices</li>
                    <li><i class="bi bi-award me-2"></i>Certificates</li>
                </ul>
            </div>

            <!-- Login form -->
            <div class="col-lg-6 d-flex align-items-center justify-content-center p-4">
                <div class="card border-0 shadow-sm w-100 login-card">
                    <div class="card-body p-4 p-md-5">

                        <!-- Brand shown on small screens only -->
                        <div class="text-center d-lg-none mb-3">
                            <i class="bi bi-mortarboard-fill fs-1 text-brand"></i>
                            <h4 class="fw-bold">EduTrack</h4>
                        </div>

                        <h3 class="fw-semibold mb-1">Welcome back</h3>
                        <p class="text-muted mb-4">Sign in to the admin panel</p>

                        <form action="dashboard.html" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="admin@edutrack.pk" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Login
                            </button>
                        </form>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.js"></script>
</body>

</html>
