<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course | EduTrack</title>

    <!-- Bootstrap, Bootstrap Icons, Poppins font and our own styles -->
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Top navbar -->
    <nav class="navbar navbar-dark bg-brand d-print-none">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold" href="dashboard.html">
                <i class="bi bi-mortarboard-fill me-2"></i>EduTrack
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3 d-none d-sm-inline">
                    <i class="bi bi-person-circle me-1"></i> Sana Malik (Admin)
                </span>
                <a href="index.html" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </a>
                <!-- Menu button: shows the sidebar on small screens -->
                <button class="navbar-toggler ms-2 d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <nav id="sidebarMenu" class="col-lg-2 sidebar collapse d-lg-block p-3 d-print-none">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="courses.html"><i class="bi bi-journal-bookmark me-2"></i>Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="batches.html"><i class="bi bi-calendar3 me-2"></i>Batches</a></li>
                    <li class="nav-item"><a class="nav-link" href="students.html"><i class="bi bi-people me-2"></i>Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="enrollments.html"><i class="bi bi-person-check me-2"></i>Enrollments</a></li>
                    <li class="nav-item"><a class="nav-link" href="invoices.html"><i class="bi bi-receipt me-2"></i>Fee Invoices</a></li>
                    <li class="nav-item"><a class="nav-link" href="certificates.html"><i class="bi bi-award me-2"></i>Certificates</a></li>
                </ul>
            </nav>

            <!-- Content area -->
            <main class="col-lg-10 p-4">

                <!-- Page title and breadcrumb -->
                <h3 class="fw-semibold mb-1">Add Course</h3>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                        <li class="breadcrumb-item"><a href="courses.html">Courses</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Add Course</li>
                    </ol>
                </nav>

                <!-- Course form -->
                <!-- Field names match the "courses" table in PLAN.md, so Laravel can use them as they are -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h6 class="fw-semibold mb-0"><i class="bi bi-journal-bookmark me-2"></i>Course Details</h6>
                    </div>
                    <div class="card-body p-4">
                        <form action="courses.html" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="title" class="form-label">Course Title <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="title" name="title" placeholder="e.g. Web Development" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                                    <select class="form-select" id="status" name="status" required>
                                        <option value="active" selected>Active</option>
                                        <option value="closed">Closed</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="duration_weeks" class="form-label">Duration (weeks) <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="duration_weeks" name="duration_weeks" min="1" placeholder="e.g. 12" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="fee" class="form-label">Fee (PKR) <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="fee" name="fee" min="0" step="500" placeholder="e.g. 25000" required>
                                </div>
                                <div class="col-12">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" name="description" rows="4" placeholder="What students will learn in this course"></textarea>
                                </div>
                            </div>

                            <!-- Save and Cancel buttons -->
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save Course</button>
                                <a href="courses.html" class="btn btn-outline-secondary ms-2">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.js"></script>
</body>

</html>
