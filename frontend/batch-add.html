<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Batch | EduTrack</title>

    <!-- Bootstrap, Bootstrap Icons, Poppins font and our own styles -->
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Top navbar -->
    <nav class="navbar navbar-dark bg-brand d-print-none">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold" href="dashboard.html">
                <i class="bi bi-mortarboard-fill me-2"></i>EduTrack
            </a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3 d-none d-sm-inline">
                    <i class="bi bi-person-circle me-1"></i> Sana Malik (Admin)
                </span>
                <a href="index.html" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </a>
                <!-- Menu button: shows the sidebar on small screens -->
                <button class="navbar-toggler ms-2 d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <nav id="sidebarMenu" class="col-lg-2 sidebar collapse d-lg-block p-3 d-print-none">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html"><i class="bi bi-journal-bookmark me-2"></i>Courses</a></li>
                    <li class="nav-item"><a class="nav-link active" href="batches.html"><i class="bi bi-calendar3 me-2"></i>Batches</a></li>
                    <li class="nav-item"><a class="nav-link" href="students.html"><i class="bi bi-people me-2"></i>Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="enrollments.html"><i class="bi bi-person-check me-2"></i>Enrollments</a></li>
                    <li class="nav-item"><a class="nav-link" href="invoices.html"><i class="bi bi-receipt me-2"></i>Fee Invoices</a></li>
                    <li class="nav-item"><a class="nav-link" href="certificates.html"><i class="bi bi-award me-2"></i>Certificates</a></li>
                </ul>
            </nav>

            <!-- Content area -->
            <main class="col-lg-10 p-4">

                <!-- Page title and breadcrumb -->
                <h3 class="fw-semibold mb-1">Add Batch</h3>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
                        <li class="breadcrumb-item"><a href="batches.html">Batches</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Add Batch</li>
                    </ol>
                </nav>

                <!-- Batch form -->
                <!-- Field names match the "batches" table in PLAN.md, so Laravel can use them as they are -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h6 class="fw-semibold mb-0"><i class="bi bi-calendar3 me-2"></i>Batch Details</h6>
                    </div>
                    <div class="card-body p-4">
                        <form action="batches.html" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="course_id" class="form-label">Course <span class="text-danger">*</span></label>
                                    <select class="form-select" id="course_id" name="course_id" required>
                                        <option value="" selected disabled>Select a course</option>
                                        <option value="1">Web Development</option>
                                        <option value="2">Laravel Development</option>
                                        <option value="3">React &amp; Next.js</option>
                                        <option value="4">Python Programming</option>
                                        <option value="5">Graphic Design</option>
                                        <option value="6">Digital Marketing</option>
                                        <option value="7">MS Office Essentials</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Batch Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" name="name" placeholder="e.g. WD-2612" required>
                                    <div class="form-text">Course code, then year and month the batch starts.</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="start_date" class="form-label">Start Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="start_date" name="start_date" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="end_date" class="form-label">End Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="end_date" name="end_date" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="timing" class="form-label">Timing <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="timing" name="timing" placeholder="e.g. Mon–Fri, 6:00 PM" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="instructor" class="form-label">Instructor <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="instructor" name="instructor" placeholder="e.g. Kamran Akhtar" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="seats" class="form-label">Seats <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="seats" name="seats" min="1" placeholder="e.g. 25" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                                    <select class="form-select" id="status" name="status" required>
                                        <option value="upcoming" selected>Upcoming</option>
                                        <option value="active">Active</option>
                                        <option value="completed">Completed</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Save and Cancel buttons -->
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save Batch</button>
                                <a href="batches.html" class="btn btn-outline-secondary ms-2">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>

            </main>

        </div>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.js"></script>
</body>

</html>
